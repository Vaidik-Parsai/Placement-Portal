{% extends "base.html" %}
{% block content %}
<div class="row justify-content-center mt-4">
    <div class="col-md-5">
        <div class="card">
            <div class="card-body p-4">
                <h3 class="text-center mb-4"><i class="bi bi-person-badge"></i> Student Registration</h3>
                <form method="POST">
                    <h6 class="text-muted text-uppercase small border-bottom pb-2" style="letter-spacing:.05em;">Login Credentials</h6>
                    <div class="mb-3"><label class="form-label">Username</label><input type="text" name="username" class="form-control" required></div>
                    <div class="mb-3"><label class="form-label">Password</label><input type="password" name="password" class="form-control" required></div>
                    <h6 class="text-muted text-uppercase small border-bottom pb-2 mt-4" style="letter-spacing:.05em;">Academic Details</h6>
                    <div class="mb-3"><label class="form-label">Full Name</label><input type="text" name="full_name" class="form-control" required></div>
                    <div class="mb-3"><label class="form-label">Roll Number</label><input type="text" name="roll_no" class="form-control" required></div>
                    <div class="mb-3"><label class="form-label">CGPA</label><input type="number" step="0.01" name="cgpa" class="form-control" required></div>
                    <button type="submit" class="btn btn-primary w-100 mt-2">Register</button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
