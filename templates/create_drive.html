{% extends "base.html" %}

{% block content %}
<div class="row justify-content-center mt-4">
    <div class="col-md-7">
        <div class="card">
            <div class="card-header bg-primary text-white">
                <h4 class="mb-0"><i class="bi bi-briefcase-fill"></i> Create Placement Drive</h4>
            </div>
            <div class="card-body">
                <form method="POST">
                    <div class="mb-3">
                        <label class="form-label">Job Title</label>
                        <input type="text" name="job_title" class="form-control" placeholder="e.g. Software Engineer Intern" required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Job Description</label>
                        <textarea name="job_description" class="form-control" rows="4" placeholder="Mention roles, responsibilities, and salary details..." required></textarea>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Eligibility Criteria</label>
                        <input type="text" name="eligibility_criteria" class="form-control" placeholder="e.g. B.Tech CS/IT, 7.5+ CGPA, No Active Backlogs" required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Application Deadline</label>
                        <input type="date" name="application_deadline" class="form-control" required>
                        <small class="text-muted">Students cannot apply after this date.</small>
                    </div>

                    <hr>
                    <div class="d-flex justify-content-between">
                        <a href="{{ url_for('company_dashboard') }}" class="btn btn-outline-secondary">Cancel</a>
                        <button type="submit" class="btn btn-primary px-4">Post Drive for Approval</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
