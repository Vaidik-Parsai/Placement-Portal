{% extends "base.html" %}
{% block title %}Create placement drive | Placement Portal{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-12 col-lg-8 col-xl-7">
        <section class="card">
            <div class="card-body p-4 p-md-5">
                <div class="page-heading mb-4">
                    <h1 class="h3"><i class="bi bi-briefcase me-2 text-primary"></i>Create a placement drive</h1>
                    <p>Share the role details so eligible students can review the opportunity.</p>
                </div>
                <form method="POST">
                    <div class="mb-3">
                        <label for="job_title" class="form-label">Job title</label>
                        <input id="job_title" type="text" name="job_title" class="form-control" placeholder="e.g. Software Engineer Intern" required>
                    </div>

                    <div class="mb-3">
                        <label for="job_description" class="form-label">Job description</label>
                        <textarea id="job_description" name="job_description" class="form-control" rows="5" placeholder="Describe responsibilities, requirements, and compensation details..." required></textarea>
                    </div>

                    <div class="mb-3">
                        <label for="eligibility_criteria" class="form-label">Eligibility criteria</label>
                        <input id="eligibility_criteria" type="text" name="eligibility_criteria" class="form-control" placeholder="e.g. B.Tech CS/IT, 7.5+ CGPA, no active backlogs" required>
                    </div>

                    <div class="mb-3">
                        <label for="application_deadline" class="form-label">Application deadline</label>
                        <input id="application_deadline" type="date" name="application_deadline" class="form-control" required>
                        <div class="form-text">Students will not be able to apply after this date.</div>
                    </div>

                    <div class="d-flex flex-column-reverse flex-sm-row justify-content-between gap-2 mt-4">
                        <a href="{{ url_for('company_dashboard') }}" class="btn btn-outline-secondary">Cancel</a>
                        <button type="submit" class="btn btn-primary"><i class="bi bi-send me-1"></i> Submit drive for approval</button>
                    </div>
                </form>
            </div>
        </section>
    </div>
</div>
{% endblock %}
