{% extends "base.html" %}
{% block content %}
<div class="container text-center mt-5">
    <h2 class="d-inline-block border-0">Join the Placement Portal</h2>
    <p class="text-muted">Please select your role to continue</p>
    <div class="row mt-4 justify-content-center g-3">
        <div class="col-md-4 mb-3">
            <div class="card h-100">
                <div class="card-body py-4">
                    <i class="bi bi-person-badge fs-1 text-info"></i>
                    <h4 class="mt-2">Student</h4>
                    <p class="text-muted small">Apply for drives and track applications.</p>
                    <a href="{{ url_for('register_student') }}" class="btn btn-primary w-100">Register as Student</a>
                </div>
            </div>
        </div>
        <div class="col-md-4 mb-3">
            <div class="card h-100">
                <div class="card-body py-4">
                    <i class="bi bi-building fs-1 text-info"></i>
                    <h4 class="mt-2">Company</h4>
                    <p class="text-muted small">Post drives and recruit top talent.</p>
                    <a href="{{ url_for('register_company') }}" class="btn btn-outline-primary w-100">Register as Company</a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
