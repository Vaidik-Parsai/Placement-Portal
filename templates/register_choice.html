{% extends "base.html" %}
{% block content %}
<div class="container text-center mt-5">
    <h2>Join the Placement Portal</h2>
    <p class="text-muted">Please select your role to continue</p>
    <div class="row mt-4 justify-content-center">
        <div class="col-md-4 mb-3">
            <div class="card h-100 shadow-sm">
                <div class="card-body">
                    <i class="bi bi-person-badge fs-1"></i>
                    <h4>Student</h4>
                    <p>Apply for drives and track applications.</p>
                    <a href="{{ url_for('register_student') }}" class="btn btn-primary w-100">Register as Student</a>
                </div>
            </div>
        </div>
        <div class="col-md-4 mb-3">
            <div class="card h-100 shadow-sm">
                <div class="card-body">
                    <i class="bi bi-building fs-1"></i>
                    <h4>Company</h4>
                    <p>Post drives and recruit top talent.</p>
                    <a href="{{ url_for('register_company') }}" class="btn btn-outline-primary w-100">Register as Company</a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
